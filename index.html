    <!-- Script de detecção crítica de rota para evitar Flash de Skeleton e Prerender -->
    <script>
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var params = new URLSearchParams(search);
            var hasRid = params.has('rid');
            
            // Define o que é considerado a landing page pública e seus artigos
            var isPublicLanding = (path === '/' && !hasRid) || 
                                  (path.startsWith('/guia') && !hasRid) || 
                                  path === '/politica-privacidade' ||
                                  path === '/lili' ||
                                  path === '/flat-lili';
                                  
            if (!isPublicLanding) {
                document.documentElement.classList.add('route-private');
                var style = document.createElement('style');
                style.id = 'critical-skeleton-override';
                style.innerHTML = '.route-private #root > * { display: none !important; } #app-skeleton { display: none !important; }';
                document.head.appendChild(style);
            }
        })();
    </script>
